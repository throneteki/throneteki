name: Deploy Game Nodes
on:
    workflow_dispatch:
        inputs:
            environment:
                type: environment
                description: Select the environment
                default: Production
    workflow_call:
        inputs:
            environment:
                type: string
                required: true
            ref:
                type: string
                description: The commit to deploy the charts from
                default: ''
            image_tag:
                type: string
                description: The image tag to deploy, overriding the environment's
                default: ''

concurrency:
    group: deploy-node-${{ inputs.environment }}
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: self-hosted
        environment: ${{ inputs.environment }}
        steps:
            - name: Checkout repo
              uses: actions/checkout@v3
              with:
                  ref: ${{ inputs.ref }}

            - name: Deploy Game Nodes
              run: |
                  ENV=$(echo "${{ inputs.environment }}" | tr '[:upper:]' '[:lower:]')

                  if [ "${{ inputs.environment }}" = "Production" ]; then
                    NAMESPACE="throneteki"
                    REPLICAS=2
                    SCALE_INCREMENT=2
                    ENV_SUBDOMAIN="production"
                  elif [ "${{ inputs.environment }}" = "Development" ]; then
                    NAMESPACE="throneteki-development"
                    REPLICAS=1
                    SCALE_INCREMENT=1
                    ENV_SUBDOMAIN="dev"
                  elif [ "${{ inputs.environment }}" = "Playtesting" ]; then
                    NAMESPACE="throneteki-playtesting"
                    REPLICAS=1
                    SCALE_INCREMENT=1
                    ENV_SUBDOMAIN="playtesting"
                  else
                    NAMESPACE="throneteki-$ENV"
                    REPLICAS=1
                    SCALE_INCREMENT=1
                    ENV_SUBDOMAIN="$ENV"
                  fi

                  echo "Deploying to $NAMESPACE ($REPLICAS replicas)"
                  DEPLOY_TIME=$(date +%s)
                  echo "Deployment timestamp: $DEPLOY_TIME"

                  # Optional image override from GitHub env/vars
                  # Supported:
                  #   NODE_IMAGE (full image e.g., ghcr.io/org/app:tag)
                  #   NODE_IMAGE_REPO and/or NODE_IMAGE_TAG
                  HELM_IMAGE_FLAGS=""
                  if [ -n "${{ vars.NODE_IMAGE }}" ]; then
                    FULL_IMAGE="${{ vars.NODE_IMAGE }}"
                    REPO="${FULL_IMAGE%:*}"
                    TAG="${FULL_IMAGE#*:}"
                    if [ "$REPO" = "$TAG" ]; then
                      REPO="$FULL_IMAGE"
                      TAG="latest"
                    fi
                    HELM_IMAGE_FLAGS="--set-string image.repository=$REPO --set-string image.tag=$TAG"
                  else
                    if [ -n "${{ vars.NODE_IMAGE_REPO }}" ]; then
                      REPO="${{ vars.NODE_IMAGE_REPO }}"
                      HELM_IMAGE_FLAGS+=" --set-string image.repository=$REPO"
                    fi
                    if [ -n "${{ vars.NODE_IMAGE_TAG }}" ]; then
                      TAG="${{ vars.NODE_IMAGE_TAG }}"
                      HELM_IMAGE_FLAGS+=" --set-string image.tag=$TAG"
                    fi
                  fi
                  if [ -n "${{ inputs.image_tag }}" ]; then
                    HELM_IMAGE_FLAGS+=" --set-string image.tag=${{ inputs.image_tag }}"
                  fi

                  cat > /tmp/node-secrets.yaml <<EOF
                  nodeConfig:
                    env: "${{ vars.NODE_ENV || 'production' }}"
                    instance:
                      type: "$ENV"
                    sentryDsn: "${{ secrets.SENTRY_DSN }}"
                    dbPath: "${{ secrets.DB_PATH }}"
                    redisKeyPrefix: "$ENV"
                    redisUrl: "${{ secrets.REDIS_URL }}"
                    secret: "${{ secrets.SECRET }}"
                    hmacSecret: "${{ secrets.HMAC_SECRET }}"
                    lobbyUrl: "${{ vars.LOBBY_URL }}"
                    socketioPort: 80
                  EOF

                  # Keep whatever is running now, including temporary pods left by a deploy that
                  # failed part way, so helm does not remove pods that still hold games
                  CURRENT_REPLICAS=$(kubectl get statefulset node -n $NAMESPACE -o jsonpath='{.spec.replicas}' 2>/dev/null || true)
                  CURRENT_REPLICAS=${CURRENT_REPLICAS:-$REPLICAS}

                  helm upgrade --install game-node ./infrastructure/node \
                    --set namespace=$NAMESPACE \
                    --set replicaCount=$CURRENT_REPLICAS \
                    --set environment=$ENV_SUBDOMAIN \
                    --set deployTime=$DEPLOY_TIME \
                    $HELM_IMAGE_FLAGS \
                    -f /tmp/node-secrets.yaml \
                    -n $NAMESPACE

                  rm /tmp/node-secrets.yaml

                  GENERATION=$(kubectl get statefulset node -n $NAMESPACE -o jsonpath='{.metadata.generation}')
                  until [ "$(kubectl get statefulset node -n $NAMESPACE -o jsonpath='{.status.observedGeneration}')" = "$GENERATION" ]; do
                    sleep 2
                  done
                  UPDATE_REVISION=$(kubectl get statefulset node -n $NAMESPACE -o jsonpath='{.status.updateRevision}')
                  echo "Rolling out revision $UPDATE_REVISION"

                  pod_exists() {
                    kubectl get pod "$1" -n $NAMESPACE >/dev/null 2>&1
                  }

                  pod_revision() {
                    kubectl get pod "$1" -n $NAMESPACE -o jsonpath='{.metadata.labels.controller-revision-hash}' 2>/dev/null || true
                  }

                  wait_for_new_pod() {
                    local POD=$1
                    echo "Waiting for $POD to be ready on the new revision..."
                    for ATTEMPT in $(seq 1 360); do
                      READY=$(kubectl get pod "$POD" -n $NAMESPACE -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
                      if [ "$(pod_revision $POD)" = "$UPDATE_REVISION" ] && [ "$READY" = "True" ]; then
                        echo "$POD is ready."
                        return 0
                      fi
                      sleep 5
                    done
                    echo "$POD did not become ready."
                    return 1
                  }

                  # Stops new games on each pod, then waits until each has no games left. The pods
                  # keep running and serving their games until they are removed.
                  drain() {
                    for POD in "$@"; do
                      echo "Draining $POD..."
                      RESULT=$(kubectl exec -n $NAMESPACE $POD -- wget -q -O- --post-data='' http://localhost:9000/health/drain 2>/dev/null || echo "error")
                      if [ "$RESULT" = "error" ]; then
                        # Nodes from before the drain endpoint drain on SIGTERM and exit when empty
                        echo "$POD has no drain endpoint; sending SIGTERM."
                        kubectl exec -n $NAMESPACE $POD -- /bin/sh -c "kill -TERM \$(pidof node)" || true
                      fi
                    done

                    for POD in "$@"; do
                      ATTEMPTS=0
                      while [ $ATTEMPTS -lt 540 ]; do
                        if ! pod_exists $POD; then
                          echo "$POD is gone."
                          break
                        fi
                        GAMES=$(kubectl exec -n $NAMESPACE $POD -- wget -q -O- http://localhost:9000/health/games 2>/dev/null || echo "error")
                        if [ "$GAMES" = "0" ]; then
                          echo "$POD: All games finished."
                          break
                        fi
                        echo "$POD: Still running $GAMES games... ($ATTEMPTS/540)"
                        ATTEMPTS=$((ATTEMPTS + 1))
                        sleep 10
                      done
                      if [ $ATTEMPTS -ge 540 ]; then
                        echo "$POD: Timed out waiting for games to finish."
                      fi
                    done
                  }

                  TEMP_REPLICAS=$((REPLICAS + SCALE_INCREMENT))
                  if [ "$CURRENT_REPLICAS" -lt "$TEMP_REPLICAS" ]; then
                    echo "Scaling up to $TEMP_REPLICAS replicas..."
                    kubectl scale statefulset node -n $NAMESPACE --replicas=$TEMP_REPLICAS
                  fi
                  for i in $(seq $REPLICAS $((TEMP_REPLICAS - 1))); do
                    POD="node-$i"
                    until pod_exists $POD; do sleep 2; done
                    echo "Waiting for $POD to become ready..."
                    kubectl wait --for=condition=ready pod/$POD -n $NAMESPACE --timeout=30m
                  done

                  OLD_PODS=""
                  for i in $(seq 0 $((REPLICAS - 1))); do
                    POD="node-$i"
                    if pod_exists $POD && [ "$(pod_revision $POD)" != "$UPDATE_REVISION" ]; then
                      OLD_PODS="$OLD_PODS $POD"
                    fi
                  done
                  echo "Replacing:$OLD_PODS"

                  if [ -n "$OLD_PODS" ]; then
                    drain $OLD_PODS
                    for POD in $OLD_PODS; do
                      echo "Replacing $POD..."
                      kubectl delete pod $POD -n $NAMESPACE --ignore-not-found --wait=true
                    done
                  fi
                  for i in $(seq 0 $((REPLICAS - 1))); do
                    POD="node-$i"
                    until pod_exists $POD; do sleep 2; done
                    wait_for_new_pod $POD
                  done

                  TEMP_PODS=""
                  for i in $(seq $REPLICAS $((TEMP_REPLICAS - 1))); do
                    TEMP_PODS="$TEMP_PODS node-$i"
                  done
                  echo "Draining temporary pods:$TEMP_PODS"
                  drain $TEMP_PODS

                  echo "Scaling back down to $REPLICAS replicas..."
                  kubectl scale statefulset node -n $NAMESPACE --replicas=$REPLICAS

                  echo "Graceful rollout complete!"
