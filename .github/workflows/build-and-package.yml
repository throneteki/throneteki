# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Build, test and package
on:
    push:
        branches: ['master', 'development-*', 'playtesting']
        paths-ignore:
            - '.github/workflows/**'
            - 'infrastructure/**'
    pull_request:
        branches: ['master', 'development-*', 'playtesting']
        paths-ignore:
            - '.github/workflows/**'
            - 'infrastructure/**'
jobs:
    build:
        name: Build & Test
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [20.x, 22.x]
                # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        steps:
            - name: Checkout source and submodules
              uses: actions/checkout@v4
              with:
                  fetch-depth: '0'
                  submodules: recursive
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
            - run: npm ci
            - run: npm run lint
            - run: npm test
    database:
        name: Database migrations
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: throneteki
                    POSTGRES_PASSWORD: throneteki
                    POSTGRES_DB: throneteki
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            NODE_CONFIG: '{"db":{"host":"localhost","port":5432,"database":"throneteki","user":"throneteki","password":"throneteki"}}'
        steps:
            - name: Checkout source and submodules
              uses: actions/checkout@v4
              with:
                  fetch-depth: '0'
                  submodules: recursive
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: 'npm'
            - run: npm ci
            - name: Check merged migrations are unchanged
              if: ${{ github.event_name == 'pull_request' }}
              run: |
                  changed=$(git diff --diff-filter=MDR --name-only origin/${{ github.base_ref }}...HEAD -- server/db/migrations)
                  if [ -n "$changed" ]; then
                      echo "::error::Migrations that are already merged must not be changed, add a new migration instead:"
                      echo "$changed"
                      exit 1
                  fi
            - name: Apply all migrations to an empty database
              run: npm run db:migrate
            - name: Revert all migrations
              run: npm run db:migrate:down -- all
            - name: Re-apply all migrations
              run: npm run db:migrate
            - name: Check server/db/schema.sql is up to date
              run: |
                  docker exec ${{ job.services.postgres.id }} pg_dump -U throneteki --schema-only --no-owner --no-privileges throneteki | node ./server/db/dump-schema.js
                  # status rather than diff, so a schema.sql that was never committed also fails
                  if [ -n "$(git status --porcelain -- server/db/schema.sql)" ]; then
                      git diff -- server/db/schema.sql
                      echo "::error::server/db/schema.sql does not match the migrations, run 'npm run db:schema:dump' and commit the result"
                      exit 1
                  fi
            - name: Create the test database
              run: docker exec ${{ job.services.postgres.id }} createdb -U throneteki throneteki_test
            - name: Database integration tests
              env:
                  # No database here, so config/test.json5 picks throneteki_test
                  NODE_CONFIG: '{"db":{"host":"localhost","port":5432,"user":"throneteki","password":"throneteki"}}'
              run: npm run test:db
    package:
        name: Push Package
        if: ${{ github.repository == vars.PACKAGEABLE_REPOSITORY && (github.ref_name == 'master' || github.ref_name == 'playtesting') && github.event_name == 'push' }}
        runs-on: ubuntu-latest
        needs: ['build', 'database']
        steps:
            - name: Checkout source and submodules
              uses: actions/checkout@v4
              with:
                  fetch-depth: '0'
                  submodules: recursive
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v2
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v2
            - name: Login to Docker Hub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_PASSWORD }}
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
            - name: Install GitVersion
              uses: gittools/actions/gitversion/setup@v0.9.14
              with:
                  versionSpec: 5.x
            - id: determine_version
              name: Determine Version
              uses: gittools/actions/gitversion/execute@v0.9.14
              with:
                  additionalArguments: /overrideconfig mode=Mainline
            - name: Build and push lobby
              uses: docker/build-push-action@v3
              with:
                  build-args: |
                      VERSION=${{ steps.determine_version.outputs.semVer }}
                      SENTRY_KEY=${{ secrets.SENTRY_DSN }}
                      SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
                      HCAPTCHA_SITE_KEY=${{ secrets.HCAPTCHA_SITE_KEY }}
                      PATREON_CLIENT_ID=${{ secrets.PATREON_CLIENTID }}
                  push: true
                  tags: ${{ secrets.DOCKERHUB_USERNAME }}/throneteki-lobby:latest, ${{ secrets.DOCKERHUB_USERNAME }}/throneteki-lobby:${{ steps.determine_version.outputs.semVer }}
            - name: Build and push node
              uses: docker/build-push-action@v3
              with:
                  build-args: |
                      "VERSION=${{ steps.determine_version.outputs.semVer }}"
                  push: true
                  file: server/gamenode/Dockerfile
                  tags: ${{ secrets.DOCKERHUB_USERNAME }}/throneteki-node:latest, ${{ secrets.DOCKERHUB_USERNAME }}/throneteki-node:${{ steps.determine_version.outputs.semVer }}
