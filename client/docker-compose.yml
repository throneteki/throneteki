version: '3.3'
services:
    client:
        restart: always
        build:
            context: .
        image: throneteki:client
        ports:
            - '8080:8080'
        environment:
            - HOST=client
            - LOBBYHOST=lobby
        command: "sh -c 'npm install && npm start'"
    lobby:
        restart: always
        image: throneteki/lobby
        ports:
            - '4000:4000'
            - '9229:9229'
        links:
            - postgres
        depends_on:
            - postgres
        command:
            - node
            - '--inspect=0.0.0.0'
            - '.'
    node:
        restart: always
        image: throneteki/node
        ports:
            - '9500:9500'
            - '9339:9339'
        command:
            - node
            - '--inspect=0.0.0.0:9339'
            - 'server/gamenode'
    postgres:
        image: postgres:16
        environment:
            POSTGRES_USER: throneteki
            POSTGRES_PASSWORD: throneteki
            POSTGRES_DB: throneteki
        volumes:
            - postgres:/var/lib/postgresql/data
volumes:
    postgres:
    node_modules:
