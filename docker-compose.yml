version: "3.3"
# Contains the necessary services to run throneteki in all environments
services:
  mongo:
    image: mongo
    volumes:
      - mongodb:/data/db
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: throneteki
      POSTGRES_PASSWORD: throneteki
      POSTGRES_DB: throneteki
    volumes:
      - postgres:/var/lib/postgresql/data
  redis:
    image: redis
volumes:
  mongodb:
  postgres:
  node_modules:
