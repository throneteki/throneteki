<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta http-equiv="refresh" content="60" />
        <title>The Iron Throne is unavailable</title>
        <style>
            :root {
                color-scheme: dark;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 16px;
                box-sizing: border-box;
                background: #1a1a1a;
                color: #e8e8e8;
                font-family:
                    system-ui,
                    -apple-system,
                    'Segoe UI',
                    Roboto,
                    sans-serif;
                line-height: 1.5;
            }

            main {
                max-width: 36rem;
                text-align: center;
            }

            .logo {
                display: block;
                width: 100%;
                max-width: 28rem;
                height: auto;
                margin: 0 auto 2rem;
            }

            h1 {
                margin: 0 0 1rem;
                font-size: 1.75rem;
                font-weight: 600;
            }

            p {
                margin: 0 0 1rem;
                color: #bdbdbd;
            }

            a {
                color: #e0b44c;
            }
        </style>
    </head>
    <body>
        <main>
            <img class="logo" src="down-logo.png" alt="The Iron Throne Online" />
            <h1>The Iron Throne is unavailable right now</h1>
            <p>
                We're most likely updating the site or restarting a server, and it should be back in
                a few minutes. Any games in progress may have been interrupted.
            </p>
            <p>
                This page will check again every minute, or you can <a href="/">try again now</a>.
            </p>
        </main>
    </body>
</html>
