{{- if .Values.etl.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
    name: throneteki-copy-from-mongo-{{ .Values.deployTime | default "0" }}
    # prettier-ignore
    namespace: {{ .Values.namespace }}
spec:
    backoffLimit: 0
    ttlSecondsAfterFinished: 604800
    template:
        metadata:
            labels:
                app: throneteki-copy-from-mongo
        spec:
            restartPolicy: Never
            containers:
                - name: copy-from-mongo
                  image: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
                  command:
                      - node
                      - server/scripts/migrate-from-mongo.js
                      - --report
                      - /tmp/migrate-from-mongo-report.json
{{- range .Values.etl.args }}
                      - {{ . | quote }}
{{- end }}
                  env:
                      - name: NODE_CONFIG
                        valueFrom:
                            secretKeyRef:
                                name: throneteki-lobby-secret
                                key: node_config
{{- end }}
