apiVersion: apps/v1
kind: Deployment
metadata:
    name: throneteki-lobby
    # prettier-ignore
    namespace: {{ .Values.namespace }}
spec:
    replicas: {{ .Values.replicas }}
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
    selector:
        matchLabels:
            app: throneteki-lobby
    template:
        metadata:
            labels:
                app: throneteki-lobby
            annotations:
                #prettier-ignore
                checksum/secret: {{ .Values.nodeConfig | toJson | sha256sum }}
                #prettier-ignore
                checksum/image: {{ .Values.image.tag | sha256sum }}
                #prettier-ignore
                deployTime: {{ .Values.deployTime | default "0" | quote }}
        spec:
            initContainers:
                # Runs before the pod is ready, so nginx has the new build's images before any page
                # references them. Unchanged files are left alone to keep their ETags, and old hashed
                # files stay for clients still on the previous build.
                - name: copy-site-images
                  image: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
                  command:
                      - sh
                      - -c
                      - |
                          cd /usr/src/app/dist/img
                          find . -type f ! -path './cards/*' ! -path './avatar/*' | while read -r f; do
                              dest="/data/site-images/$f"
                              if ! cmp -s "$f" "$dest"; then
                                  mkdir -p "$(dirname "$dest")"
                                  cp "$f" "$dest.tmp" && mv "$dest.tmp" "$dest"
                              fi
                          done
                  volumeMounts:
                      - name: site-images
                        mountPath: /data/site-images
            containers:
                - name: throneteki-lobby
                  image: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
                  imagePullPolicy: Always
                  ports:
                      - containerPort: 80
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: 80
                      initialDelaySeconds: 5
                      periodSeconds: 5
                      failureThreshold: 3
                  env:
                      - name: NODE_CONFIG
                        valueFrom:
                            secretKeyRef:
                                name: throneteki-lobby-secret
                                key: node_config
                  volumeMounts:
                      - name: avatars
                        mountPath: /usr/src/app/public/img/avatar
            volumes:
                - name: avatars
                  persistentVolumeClaim:
                      claimName: throneteki-avatars
                - name: site-images
                  persistentVolumeClaim:
                      claimName: throneteki-site-images
