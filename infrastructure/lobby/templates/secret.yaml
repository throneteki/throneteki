apiVersion: v1
kind: Secret
metadata:
    name: throneteki-lobby-secret
    # prettier-ignore
    namespace: {{ .Values.namespace }}
type: Opaque
stringData:
    node_config: {{ .Values.nodeConfig | toJson | quote }}
---
apiVersion: v1
kind: Secret
metadata:
    name: throneteki-migrate-secret
    # prettier-ignore
    namespace: {{ .Values.namespace }}
    annotations:
        # The migrate job runs as a pre-upgrade hook, before throneteki-lobby-secret is updated
        'helm.sh/hook': pre-install,pre-upgrade
        'helm.sh/hook-weight': '0'
        'helm.sh/hook-delete-policy': before-hook-creation
type: Opaque
stringData:
    node_config: {{ .Values.nodeConfig | toJson | quote }}
{{- if .Values.dbMigrator.user }}
    migrator_user: {{ .Values.dbMigrator.user | quote }}
    migrator_password: {{ .Values.dbMigrator.password | quote }}
{{- end }}
