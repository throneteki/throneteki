apiVersion: batch/v1
kind: Job
metadata:
    name: throneteki-migrate-{{ .Values.deployTime | default "0" }}
    namespace: {{ .Values.namespace }}
    annotations:
        'helm.sh/hook': pre-install,pre-upgrade
        'helm.sh/hook-weight': '1'
        'helm.sh/hook-delete-policy': before-hook-creation
spec:
    ttlSecondsAfterFinished: 300
    activeDeadlineSeconds: 600
    template:
        metadata:
            labels:
                app: throneteki-migrate
        spec:
            restartPolicy: OnFailure
            containers:
                - name: migrate
                  image: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
                  command:
                      - sh
                      - -c
                      - |
                          node server/scripts/convertevents.js && \
                          node server/scripts/convertdecks.js{{ if .Values.nodeConfig.db }} && \
                          node server/db/migrate.js up{{ end }}
                  env:
                      - name: NODE_CONFIG
                        valueFrom:
                            secretKeyRef:
                                name: throneteki-lobby-secret
                                key: node_config
{{- if .Values.dbMigrator.user }}
                      # Schema-owning credentials are only given to this job, never to the lobby
                      - name: DB_MIGRATOR_USER
                        valueFrom:
                            secretKeyRef:
                                name: throneteki-db-migrator-secret
                                key: user
                      - name: DB_MIGRATOR_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: throneteki-db-migrator-secret
                                key: password
{{- end }}