apiVersion: batch/v1
kind: Job
metadata:
    name: throneteki-migrate-{{ .Values.deployTime | default "0" }}
    namespace: {{ .Values.namespace }}
    annotations:
        'helm.sh/hook': pre-install,pre-upgrade
        'helm.sh/hook-weight': '1'
        'helm.sh/hook-delete-policy': before-hook-creation
spec:
    ttlSecondsAfterFinished: 300
    activeDeadlineSeconds: 600
    template:
        metadata:
            labels:
                app: throneteki-migrate
        spec:
            restartPolicy: OnFailure
            containers:
                - name: migrate
                  image: '{{ .Values.image.repository }}:{{ .Values.image.tag }}'
                  command:
                      - node
                      - server/db/migrate.js
                      - up
                  env:
                      - name: NODE_CONFIG
                        valueFrom:
                            secretKeyRef:
                                name: throneteki-migrate-secret
                                key: node_config
{{- if .Values.dbMigrator.user }}
                      - name: DB_MIGRATOR_USER
                        valueFrom:
                            secretKeyRef:
                                name: throneteki-migrate-secret
                                key: migrator_user
                      - name: DB_MIGRATOR_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: throneteki-migrate-secret
                                key: migrator_password
{{- end }}