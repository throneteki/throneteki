apiVersion: v1
kind: ConfigMap
metadata:
    name: throneteki-static-nginx-config
    # prettier-ignore
    namespace: {{ .Values.namespace }}
data:
    nginx.conf: |
        worker_processes auto;
        error_log /dev/stderr warn;
        pid /var/run/nginx.pid;

        events {
            worker_connections 1024;
        }

        http {
            include /etc/nginx/mime.types;
            default_type application/octet-stream;

            log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" "$http_x_forwarded_for"';

            access_log /dev/stdout main;

            sendfile on;
            tcp_nopush on;
            tcp_nodelay on;
            keepalive_timeout 65;
            types_hash_max_size 2048;

            # Enable gzip compression
            gzip on;
            gzip_vary on;
            gzip_proxied any;
            gzip_comp_level 6;
            gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;

            server {
                listen 80;
                server_name _;

                root /usr/share/nginx/html;

                # add_header only applies to successful responses, so a 404 for an image that
                # fetchdata has not downloaded yet is not cached
                location /img/cards/ {
                    add_header Cache-Control "public, max-age=604800";
                    access_log off;
                }

                # Avatars can change under the same URL
                location /img/avatar/ {
                    add_header Cache-Control "public, max-age=86400";
                    access_log off;
                }

                # Vite puts a content hash in these names
                location /img/assets/ {
                    root /usr/share/nginx/site;
                    add_header Cache-Control "public, max-age=31536000, immutable";
                    access_log off;
                }

                location /img/ {
                    root /usr/share/nginx/site;
                    add_header Cache-Control "public, max-age=86400";
                    access_log off;
                }

                location = /down.html {
                    add_header Cache-Control "no-store";
                }

                # Health check endpoint
                location /health {
                    access_log off;
                    return 200 "OK\n";
                    add_header Content-Type text/plain;
                }
            }
        }
